name: build-kernel

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and boot-image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils grub-pc-bin xorriso mtools
      - name: Build kernel
        run: make
      - name: Validate ELF and Multiboot header
        run: make check
      - name: Build bootable ISO
        run: make iso
